<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de gestion de Stock y Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    </header>
    <main>
        <h1>Sistema de gestion de Stock y Mantenimiento</h1>
        <form action="procesar_formulario.php" method="post">
            <label for="maquina">Maquina:</label>
            <input type="text" id="maquina" name="maquina" placeholder="Codigo QR de la máquina" required>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" required
                placeholder="Describí el problema que observaste…"></textarea>

            <label for="foto">Foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*" required>

            <label for="turno">Turno:</label>
            <select id="turno" name="turno" required>
                <option value="">Seleccione un turno</option>
                <option value="manana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sistema de gestion de Stock y Mantenimiento. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
